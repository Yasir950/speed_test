<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 90 90" width="90" height="90">
  <defs>
    <linearGradient id="speedGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F2FE" />
      <stop offset="100%" stop-color="#4FACFE" />
    </linearGradient>
    <linearGradient id="uploadGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#00C9FF" />
      <stop offset="100%" stop-color="#92FE9D" />
    </linearGradient>
  </defs>

  <g transform="translate(10, 10)">
    <!-- Speedometer outer arc -->
    <path d="M 15 65 A 35 35 0 1 1 75 65" fill="none" stroke="url(#speedGrad)" stroke-width="7" stroke-linecap="round" stroke-dasharray="120 40" />
    <!-- Download arrow -->
    <path d="M 33 32 L 33 55 M 26 48 L 33 55 L 40 48" fill="none" stroke="url(#speedGrad)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Upload arrow -->
    <path d="M 57 58 L 57 35 M 50 42 L 57 35 L 64 42" fill="none" stroke="url(#uploadGrad)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Central dial dot -->
    <circle cx="45" cy="70" r="3" fill="#00F2FE"/>
  </g>
</svg>
